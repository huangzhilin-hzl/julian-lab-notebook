# Harbor task: launch an sglang server, run one fixed-load bench_serving pass, keep the result JSON.
# Every value marked TODO(...) must be filled before running. Grep: `rg TODO task.toml instruction.md`
# Format reference: harbor v0.25.0 docs-mintlify/tasks/configuration.mdx (schema_version 1.4).
schema_version = "1.4"

# Collected after the agent phase and copied into the separate verifier at the same path
# (docs-mintlify/tasks/artifacts.mdx).
artifacts = ["/app/results"]

[task]
name = "molou/TODO-task-name"          # TODO(task-name): org/name, e.g. molou/dsv41-flash-h200-fp4-lowlatency
description = "TODO(description): one line, e.g. 'DSv4.1 Flash on 8xH200, cookbook low-latency recipe, ISL/OSL=1k/1k, conc=1'"
authors = [{ name = "zhilin huang" }]
keywords = ["sglang", "inference-benchmark"]

[metadata]
source = "TODO(source): cookbook/blog URL or 'zhilin instruction <date>'"
category = "inference-benchmark"

[agent]
# Covers image pull + weight load + CUDA graph capture + the benchmark itself.
timeout_sec = 3600.0                   # TODO(agent-timeout): size for the model; big MoE loads can take >20 min

[environment]
docker_image = "TODO_SGLANG_IMAGE"     # TODO(image): e.g. lmsysorg/sglang:<tag>; prefer a digest-pinned ref
gpus = 1                               # TODO(gpu-count): must equal the server's TP*DP*... world size
gpu_types = ["TODO_GPU_TYPE"]          # TODO(gpu-type): e.g. "H200". Docker ignores it; GKE maps it to a node selector
cpus = 16                              # TODO(cpus)
memory_mb = 65536                      # TODO(memory)
storage_mb = 204800                    # TODO(storage): weights live here if downloaded at runtime
network_mode = "public"                # needed if MODEL_PATH is a HF id (weight download)

[environment.env]
# Persistent env for every exec in the sandbox (agent and oracle). Values are strings.
# ${VAR} is resolved from the *host* running harbor (docs: tasks/configuration.mdx, environment.env).
HF_TOKEN = "${HF_TOKEN:-}"
MODEL_PATH = "TODO_MODEL_PATH"         # TODO(model): HF id or path inside the container
SERVER_PORT = "30000"
# Full server command, copied verbatim from the source (cookbook/blog). Executed with `bash -c`.
# It must bind to SERVER_PORT. Keep model/host/port inside this string so it reads like the source.
SGLANG_LAUNCH_CMD = "TODO_LAUNCH_CMD"  # TODO(launch): e.g. "sglang serve --model-path $MODEL_PATH --tp 8 --host 127.0.0.1 --port 30000 <flags Y>"
SERVER_READY_TIMEOUT_SEC = "2400"
# Benchmark client. sglang.bench_serving is deprecated on sglang main (now sglang.benchmark.serving)
# but still works there and is the only name in older images.
BENCH_MODULE = "sglang.bench_serving"
BENCH_DATASET = "random-ids"           # random-ids: synthetic ids, no download; "random" downloads ShareGPT from HF
BENCH_INPUT_LEN = "TODO_ISL"           # TODO(load)
BENCH_OUTPUT_LEN = "TODO_OSL"          # TODO(load)
BENCH_RANGE_RATIO = "1.0"              # 1.0 = fixed lengths; sglang default is 0.0 (lengths sampled)
BENCH_NUM_PROMPTS = "TODO_NUM_PROMPTS" # TODO(load)
BENCH_MAX_CONCURRENCY = "TODO_CONC"    # TODO(load)
BENCH_REQUEST_RATE = "inf"
BENCH_SEED = "42"
BENCH_EXTRA_ARGS = ""                  # e.g. "--warmup-requests 4"

[verifier]
timeout_sec = 300.0
environment_mode = "separate"          # grade from artifacts in a small CPU-only container

[verifier.environment]
# Separate verifier: built from tests/Dockerfile, no GPU.
gpus = 0
cpus = 1
memory_mb = 1024
network_mode = "no-network"

[verifier.env]
# Must mirror the load in [environment.env]; the verifier checks the result was produced with it.
EXPECTED_NUM_PROMPTS = "TODO_NUM_PROMPTS"
EXPECTED_INPUT_LEN = "TODO_ISL"
EXPECTED_OUTPUT_LEN = "TODO_OSL"
EXPECTED_MAX_CONCURRENCY = "TODO_CONC"
# Optional JSON object of top-level /server_info keys that must match, e.g. '{"tp_size": 8}'.
# Leave empty until the keys are confirmed against a real run of the target image.
EXPECTED_SERVER_INFO_JSON = ""

[solution.env]
